name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh
      - name: JS syntax
        run: for f in scripts/*.js templates/*.js; do node --check "$f"; done
      - name: JSON validity
        run: |
          jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json
          jq empty templates/*.json.tmpl 2>/dev/null || true
      - name: Entry points exist
        run: test -f AGENTS.md -a -f guides/local-docker.md -a -f guides/aws-single-instance.md
      - name: Paths mentioned in markdown exist
        run: |
          missing=0
          for f in $(grep -rhoE '(guides|scripts|templates)/[A-Za-z0-9_./-]+\.(md|sh|js|json|tmpl)' --include='*.md' . | sort -u); do
            [ -e "$f" ] || { echo "missing: $f"; missing=1; }
          done
          exit $missing
      - name: SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' && grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "bad frontmatter: $f"; exit 1; }
          done
