name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SKILL: skills/passport-setup
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --severity=warning -s bash "$SKILL"/scripts/passport-onboard tools/*.sh
          shellcheck --severity=warning -s sh "$SKILL"/templates/vault-start.sh
      - name: Shared files are copied into every skill
        run: tools/sync-shared.sh --check
      - name: Scripts never touch the CLI's passportrc (it holds live tokens)
        run: |
          ! grep -rn 'passportrc' skills/*/scripts skills/*/templates tools
      - name: passport-onboard smoke test (no Docker, no network writes)
        run: |
          export PASSPORT_ONBOARD_HOME="$(mktemp -d)" PASSPORT_ONBOARD_PREFIX=citest
          S="$SKILL/scripts/passport-onboard"
          "$S" status | jq -e '.ok and .data.next == "welcome"'
          "$S" mark welcome | jq -e '.data.marked == "welcome"'
          [ "$("$S" status --line)" = "[#---------] 1/10 done · next: Choose your setup" ]
          "$S" demo plan | jq -e '.data.objects | length == 5'
          "$S" handson plan | jq -e '.data.objects[3].path == "/public/v1/*"'
          set +e
          "$S" mark nope >/dev/null; [ $? -eq 1 ] || exit 1
          "$S" proxy prepare >/dev/null; [ $? -eq 3 ] || exit 1
          "$S" key check >/dev/null; [ $? -eq 3 ] || exit 1
      - name: JSON validity
        run: |
          jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json .agents/plugins/marketplace.json \
            .cursor-plugin/plugin.json .cursor-plugin/marketplace.json
      - name: Plugin manifests agree
        run: |
          fail() { echo "$1"; exit 1; }
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json; do
            [ "$(jq -r .name "$f")" = passport ] || fail "$f: name must be passport"
          done
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json .cursor-plugin/marketplace.json; do
            [ "$(jq -r .name "$f")" = passport-skills ] || fail "$f: marketplace name must be passport-skills"
            jq -e '[.plugins[].name] == ["passport"]' "$f" >/dev/null || fail "$f: must list exactly one plugin, passport"
          done
          [ "$(jq -r .version .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json | sort -u | wc -l)" -eq 1 ] \
            || fail "plugin.json versions differ"
      - name: Entry points exist
        run: |
          for f in AGENTS.md "$SKILL/SKILL.md" "$SKILL/references/stages.md" "$SKILL/references/welcome.md" \
            "$SKILL/scripts/passport-onboard" skills/passport-public-api/SKILL.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          test -x "$SKILL/scripts/passport-onboard" || { echo "passport-onboard must be executable"; exit 1; }
      - name: Paths mentioned in markdown exist (relative to the skill folder)
        run: |
          missing=0
          for f in $(grep -rhoE '(references|scripts|templates)/[A-Za-z0-9_./-]+\.(md|sh|env|hcl|tmpl)' --include='*.md' . | sort -u); do
            [ -e "$SKILL/$f" ] || { echo "missing: $f"; missing=1; }
          done
          exit $missing
      - name: Skills are self-contained (no symlinks)
        run: |
          links=$(find skills -type l)
          [ -z "$links" ] || { echo "symlinks in a skill folder: $links"; exit 1; }
      - name: SKILL.md stays short (detail belongs in references/)
        run: |
          for f in skills/*/SKILL.md; do
            [ "$(wc -l < "$f")" -le 160 ] || { echo "$f is over 160 lines"; exit 1; }
          done
      - name: SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' && grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "bad frontmatter: $f"; exit 1; }
          done
      - name: SKILL.md description fits the 1024-character limit
        run: |
          for f in skills/*/SKILL.md; do
            node -e '
              const fm = require("fs").readFileSync(process.argv[1], "utf8").split(/^---$/m)[1];
              const m = fm.match(/^description:[ \t]*>[-+]?[ \t]*\n((?:[ \t]+.*\n?)*)/m) || fm.match(/^description:[ \t]*(.*)$/m);
              const d = m[1].split("\n").map(s => s.trim()).filter(Boolean).join(" ");
              if (d.length > 1024) { console.log(`${process.argv[1]}: description is ${d.length} characters (max 1024)`); process.exit(1); }
            ' "$f"
          done
      - name: Claude Code accepts the marketplace and plugin manifests
        run: npx -y @anthropic-ai/claude-code plugin validate .
