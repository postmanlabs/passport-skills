name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SKILL: skills/passport-setup
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning "$SKILL"/scripts/*.sh
      - name: JS syntax
        run: for f in "$SKILL"/scripts/*.js "$SKILL"/templates/*.js; do node --check "$f"; done
      - name: JSON validity
        run: |
          jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json .agents/plugins/marketplace.json \
            .cursor-plugin/plugin.json .cursor-plugin/marketplace.json "$SKILL"/templates/*.json
          jq empty "$SKILL"/templates/*.json.tmpl 2>/dev/null || true
      - name: Plugin manifests agree
        run: |
          fail() { echo "$1"; exit 1; }
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json; do
            [ "$(jq -r .name "$f")" = passport ] || fail "$f: name must be passport"
          done
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json .cursor-plugin/marketplace.json; do
            [ "$(jq -r .name "$f")" = passport-skills ] || fail "$f: marketplace name must be passport-skills"
            jq -e '[.plugins[].name] == ["passport"]' "$f" >/dev/null || fail "$f: must list exactly one plugin, passport"
          done
          [ "$(jq -r .version .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json | sort -u | wc -l)" -eq 1 ] \
            || fail "plugin.json versions differ"
      - name: Entry points exist
        run: test -f AGENTS.md -a -f "$SKILL/SKILL.md" -a -f "$SKILL/guides/local-docker.md" -a -f "$SKILL/guides/aws-single-instance.md"
      - name: Paths mentioned in markdown exist (relative to the skill folder)
        run: |
          missing=0
          for f in $(grep -rhoE '(guides|scripts|templates)/[A-Za-z0-9_./-]+\.(md|sh|js|json|tmpl)' --include='*.md' . | sort -u); do
            [ -e "$SKILL/$f" ] || { echo "missing: $f"; missing=1; }
          done
          exit $missing
      - name: Skill is self-contained (no symlinks)
        run: |
          links=$(find "$SKILL" -type l)
          [ -z "$links" ] || { echo "symlinks in the skill folder: $links"; exit 1; }
      - name: SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' && grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "bad frontmatter: $f"; exit 1; }
          done
      - name: SKILL.md description fits the 1024-character limit
        run: |
          for f in skills/*/SKILL.md; do
            node -e '
              const fm = require("fs").readFileSync(process.argv[1], "utf8").split(/^---$/m)[1];
              const m = fm.match(/^description:[ \t]*>[-+]?[ \t]*\n((?:[ \t]+.*\n?)*)/m) || fm.match(/^description:[ \t]*(.*)$/m);
              const d = m[1].split("\n").map(s => s.trim()).filter(Boolean).join(" ");
              if (d.length > 1024) { console.log(`${process.argv[1]}: description is ${d.length} characters (max 1024)`); process.exit(1); }
            ' "$f"
          done
      - name: Claude Code accepts the marketplace and plugin manifests
        run: npx -y @anthropic-ai/claude-code plugin validate .
